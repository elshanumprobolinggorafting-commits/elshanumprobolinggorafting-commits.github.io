<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Atur Ulang Kata Sandi | Probolinggo Rafting</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #17323a;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 18px;
      padding: 36px;
      box-shadow: 0 15px 45px rgba(0,0,0,.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo strong {
      display: block;
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      display: block;
      margin-top: 5px;
      font-size: 13px;
      color: #718087;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
    }

    .intro {
      text-align: center;
      color: #66777d;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d7e0e3;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #168c91;
      box-shadow: 0 0 0 3px rgba(22,140,145,.10);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 24px;
      background: #168c91;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      opacity: .92;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 10px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #a32929;
    }

    .message.success {
      display: block;
      background: #edf9f1;
      color: #20733b;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #168c91;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      <strong>PROBOLINGGO RAFTING</strong>
      <span>Admin Area</span>
    </div>

    <h1>Atur Ulang Kata Sandi</h1>

    <p class="intro">
      Silakan masukkan kata sandi baru untuk akun Admin Anda.
    </p>

    <form id="resetForm">

      <label for="password">Kata Sandi Baru</label>
      <input
        type="password"
        id="password"
        placeholder="Masukkan kata sandi baru"
        minlength="8"
        required
      >

      <label for="confirmPassword">Ulangi Kata Sandi</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Ulangi kata sandi baru"
        minlength="8"
        required
      >

      <button type="submit" id="submitBtn">
        Simpan Password Baru
      </button>

    </form>

    <div id="message" class="message"></div>

    <a class="back" href="index.html">
      ← Kembali ke Website
    </a>

  </div>

  <script>
    const SUPABASE_URL =
      "https://ecyfvwzoazvhwkpevriy.supabase.co";

    /*
      PENTING:
      Ganti teks di bawah dengan nilai
      SUPABASE_PUBLISHABLE_KEY dari agent-mitra.html
    */
    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_ahlAi_-PJh7e8hNxGhn7_g_wBmKU8I4";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const form = document.getElementById("resetForm");
    const submitBtn = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    /*
      Supabase akan membaca session recovery
      dari URL ketika halaman dibuka melalui
      link reset password.
    */
    db.auth.onAuthStateChange(async (event, session) => {

      if (event === "PASSWORD_RECOVERY") {
        form.style.display = "block";
        return;
      }

      if (session) {
        form.style.display = "block";
      }
    });

    form.addEventListener("submit", async function(e) {

      e.preventDefault();

      const password =
        document.getElementById("password").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 8) {
        showMessage(
          "Password minimal 8 karakter.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Konfirmasi password tidak sama.",
          "error"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan...";

      const { error } = await db.auth.updateUser({
        password: password
      });

      if (error) {

        showMessage(
          "Gagal mengubah password: " + error.message,
          "error"
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "Simpan Password Baru";

        return;
      }

      showMessage(
        "Password berhasil diubah. Silakan gunakan password baru untuk masuk ke Admin.",
        "success"
      );

      form.reset();

      submitBtn.disabled = true;
      submitBtn.textContent = "Password Berhasil Diubah";
    });
  </script>

</body>
</html>
